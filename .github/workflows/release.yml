name: Release APK
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      HIVE_RELEASE_STORE_PASSWORD: ${{ secrets.HIVE_RELEASE_STORE_PASSWORD }}
      HIVE_RELEASE_KEY_ALIAS: ${{ secrets.HIVE_RELEASE_KEY_ALIAS }}
      HIVE_RELEASE_KEY_PASSWORD: ${{ secrets.HIVE_RELEASE_KEY_PASSWORD }}
      HIVE_RELEASE_KEYSTORE_BASE64: ${{ secrets.HIVE_RELEASE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Test Termux client
        run: python3 -m unittest discover -s termux -p 'test_*.py'
      - name: Check version and signing secrets
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts)"
          test -n "$version_name"
          test "$GITHUB_REF_NAME" = "v$version_name"
          test -n "$HIVE_RELEASE_STORE_PASSWORD"
          test -n "$HIVE_RELEASE_KEY_ALIAS"
          test -n "$HIVE_RELEASE_KEY_PASSWORD"
          test -n "$HIVE_RELEASE_KEYSTORE_BASE64"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Decode release keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$HIVE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hive-release.p12"
          chmod 600 "$RUNNER_TEMP/hive-release.p12"
          echo "HIVE_RELEASE_STORE_FILE=$RUNNER_TEMP/hive-release.p12" >> "$GITHUB_ENV"
      - name: Test and build signed APK
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify APK signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="dist/hive-$GITHUB_REF_NAME.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          (cd dist && sha256sum "hive-$GITHUB_REF_NAME.apk" > "hive-$GITHUB_REF_NAME.apk.sha256")
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/hive-$GITHUB_REF_NAME.apk" \
            "dist/hive-$GITHUB_REF_NAME.apk.sha256" \
            --verify-tag --generate-notes --title "Hive $GITHUB_REF_NAME"
